name: Build and deploy sayn.cc

# Every push builds the site. Pushes to main also publish it and then tell IndexNow
# which pages changed. Pushes to dev only build, as a check.

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.changed.outputs.urls }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the sitemap can date each page by its last commit

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate gallery image files
        run: bash scripts/build-gallery.sh

      - name: Build the site
        run: node scripts/build.js --require-images

      - name: Find pages that differ from the live site
        id: changed
        run: |
          {
            echo "urls<<END_OF_URLS"
            node scripts/indexnow.js changed || true
            echo "END_OF_URLS"
          } >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    needs: [build, deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Submit changed pages
        env:
          URLS: ${{ needs.build.outputs.changed }}
        run: node scripts/indexnow.js submit
