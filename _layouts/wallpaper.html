---
layout: default
---

<header>
  <h1>{{ page.title }}</h1>

  <p class="intro">
    {{ page.description }}
  </p>
</header>

<p>
  <img
    class="wallpaper-preview"
    src="/assets/wallpapers/generated/{{ page.wallpaper_id }}-preview.webp"
    alt="{{ page.alt }}">
</p>

<h2>Downloads</h2>

<div class="entry">
  <a
    href="/assets/wallpapers/generated/{{ page.wallpaper_id }}-1920.png"
    download>
    1920px
  </a>
  <p>Smaller resolution.</p>
</div>

<div class="entry">
  <a
    href="/assets/wallpapers/generated/{{ page.wallpaper_id }}-2560.png"
    download>
    2560px
  </a>
  <p>Medium resolution.</p>
</div>

<div class="entry">
  <a
    href="/assets/wallpapers/originals/{{ page.file }}"
    download>
    Original — {{ page.resolution }}
  </a>
  <p>Original full-resolution file.</p>
</div>

<p>
  <a href="/wallpapers/">← Back to wallpapers</a>
</p>
